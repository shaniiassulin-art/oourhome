<style>
/* Layout: one quiet column — sticky title bar, search, page tabs (swipeable), tinted category panels with hairline rows, bottom sheets for editing */
:root{
  --bg:#FBFCFB; --surface:#FFFFFF; --sunk:#F0F3F1; --line:#E4E9E6;
  --ink:#18221E; --muted:#5F6D66; --accent:#2D6A57; --accent-ink:#FFFFFF; --accent-soft:#DCEBE4;
  --late:#B9412A; --late-soft:#F6E0DA; --soon:#B97A12; --soon-soft:#F6EAD2; --ok:#3B8556; --ok-soft:#DDEFE2;
  /* category colors: ink + tinted panel + hairline */
  --c0:#5F6D66; --c0-bg:#F2F4F3; --c0-line:#E2E7E4;
  --c1:#B3452E; --c1-bg:#FCEFEA; --c1-line:#F3D9D0;
  --c2:#A86A0C; --c2-bg:#FBF3E3; --c2-line:#F0E0BF;
  --c3:#3D5F8C; --c3-bg:#EDF2F9; --c3-line:#D6E1EF;
  --c4:#5E7330; --c4-bg:#F1F5E8; --c4-line:#DDE6C8;
  --c5:#7A4E93; --c5-bg:#F4EEF8; --c5-line:#E4D6EE;
  --c6:#A63F6B; --c6-bg:#FAEDF3; --c6-line:#F0D3E0;
  --c7:#22786B; --c7-bg:#E8F5F2; --c7-line:#CBE7E0;
  --c8:#8A5A2B; --c8-bg:#F7F0E8; --c8-line:#EADBC9;
  --c9:#2C6E8E; --c9-bg:#EAF3F8; --c9-line:#CFE2EC;
  --c10:#5B4FA8; --c10-bg:#F0EEFA; --c10-line:#DCD8F1;
  --c11:#857318; --c11-bg:#F8F5E3; --c11-line:#ECE5BF;
  --c12:#2F7A3A; --c12-bg:#EAF5EC; --c12-line:#CCE6D1;
  --c13:#9A3B8A; --c13-bg:#F8ECF6; --c13-line:#EDD2E8;
  --c14:#4A6670; --c14-bg:#EDF2F3; --c14-line:#D5E0E3;
  --wk:#4B53B8; --wk-bg:#ECEDFB;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#171E1B; --sunk:#1E2723; --line:#28322E;
  --ink:#E8EEEA; --muted:#97A69F; --accent:#6FC1A3; --accent-ink:#0E1A16; --accent-soft:#1F3A31;
  --late:#F08A72; --late-soft:#3A221C; --soon:#E8B55A; --soon-soft:#3A2E17; --ok:#7CCB94; --ok-soft:#1C3324;
  --c0:#A3B0A9; --c0-bg:#1B2320; --c0-line:#28322E;
  --c1:#F0917A; --c1-bg:#2A1D19; --c1-line:#3D2822;
  --c2:#E6B85E; --c2-bg:#2A2416; --c2-line:#3B321D;
  --c3:#8FB1E0; --c3-bg:#1A2230; --c3-line:#263245;
  --c4:#B4CC7E; --c4-bg:#1F2616; --c4-line:#2D3820;
  --c5:#C8A3E0; --c5-bg:#251D2C; --c5-line:#352A40;
  --c6:#EE96BB; --c6-bg:#2C1A23; --c6-line:#402633;
  --c7:#6FCDBD; --c7-bg:#152824; --c7-line:#1F3A34;
  --c8:#E0B48A; --c8-bg:#29211A; --c8-line:#3A2E24;
  --c9:#86C3E0; --c9-bg:#162530; --c9-line:#213644;
  --c10:#B1A8F0; --c10-bg:#211E36; --c10-line:#302C4B;
  --c11:#DCC66A; --c11-bg:#272414; --c11-line:#38331D;
  --c12:#86D093; --c12-bg:#162619; --c12-line:#213825;
  --c13:#E59BD8; --c13-bg:#2A1A28; --c13-line:#3D2639;
  --c14:#A9C2CA; --c14-bg:#1B2326; --c14-line:#283337;
  --wk:#A9AEF5; --wk-bg:#23264A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#171E1B; --sunk:#1E2723; --line:#28322E;
  --ink:#E8EEEA; --muted:#97A69F; --accent:#6FC1A3; --accent-ink:#0E1A16; --accent-soft:#1F3A31;
  --late:#F08A72; --late-soft:#3A221C; --soon:#E8B55A; --soon-soft:#3A2E17; --ok:#7CCB94; --ok-soft:#1C3324;
  --c0:#A3B0A9; --c0-bg:#1B2320; --c0-line:#28322E;
  --c1:#F0917A; --c1-bg:#2A1D19; --c1-line:#3D2822;
  --c2:#E6B85E; --c2-bg:#2A2416; --c2-line:#3B321D;
  --c3:#8FB1E0; --c3-bg:#1A2230; --c3-line:#263245;
  --c4:#B4CC7E; --c4-bg:#1F2616; --c4-line:#2D3820;
  --c5:#C8A3E0; --c5-bg:#251D2C; --c5-line:#352A40;
  --c6:#EE96BB; --c6-bg:#2C1A23; --c6-line:#402633;
  --c7:#6FCDBD; --c7-bg:#152824; --c7-line:#1F3A34;
  --c8:#E0B48A; --c8-bg:#29211A; --c8-line:#3A2E24;
  --c9:#86C3E0; --c9-bg:#162530; --c9-line:#213644;
  --c10:#B1A8F0; --c10-bg:#211E36; --c10-line:#302C4B;
  --c11:#DCC66A; --c11-bg:#272414; --c11-line:#38331D;
  --c12:#86D093; --c12-bg:#162619; --c12-line:#213825;
  --c13:#E59BD8; --c13-bg:#2A1A28; --c13-line:#3D2639;
  --c14:#A9C2CA; --c14-bg:#1B2326; --c14-line:#283337;
  --wk:#A9AEF5; --wk-bg:#23264A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scrollbar-gutter:stable;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body.booting{opacity:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl;transition:opacity .15s}
input,select,textarea{font-size:16px!important}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(84px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg);margin-top:-20px;padding-block:14px 8px;border-bottom:1px solid transparent;transition:border-color .2s}
header.top.stuck{border-bottom-color:var(--line)}
h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;margin:0;text-wrap:balance}
.refresh{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px 7px 12px;font-weight:700;font-size:14px;flex:none}
.refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
.date{color:var(--muted);font-size:14px}
.hbtns{display:flex;gap:6px;flex:none}
.area{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunk);border-radius:14px;padding:4px;margin-top:14px}
.area button{border:0;background:transparent;border-radius:11px;padding:9px 8px;font-weight:700;font-size:15.5px;color:var(--muted)}
.area button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sect{margin-top:22px}
.sect-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:4px 0 2px;text-align:right}
.sect-h b{font-family:var(--f-display);font-weight:400;font-size:22px}
.sect-h .cnt{color:var(--muted);font-size:14px;font-weight:600}
.sect-h::after{content:"";margin-inline-start:auto;width:9px;height:9px;border-left:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg) translateY(-3px);transition:transform .2s}
.sect.closed .sect-h::after{transform:rotate(45deg)}
.sect.closed .sect-b{display:none}
.sect .group.cat:first-child{margin-top:8px}
.addrow{display:flex;align-items:center;gap:12px;padding:8px 0 10px;margin:0}
.addrow .plus{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--cc,var(--muted));color:var(--cc,var(--muted));display:grid;place-items:center;font-weight:800;flex:none;opacity:.8}
.addrow input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:6px 0}
.addrow input::placeholder{color:var(--cc,var(--muted));opacity:.75}
.addrow input:focus{outline:none}
.group.cat .row+.addrow,.group.cat .list>.addrow:not(:first-child){border-top:1px solid var(--cline)}
.tgrp{display:contents}
.tgrp-l{flex-basis:100%;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:4px}
.tgrp-l:first-child{margin-top:0}
.date b{color:var(--ink);font-weight:600}

.tools{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:12px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:11px 0}
.search input:focus{outline:none}
.search svg{flex:none;color:var(--muted)}
.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.tabs-scroll{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs-scroll::-webkit-scrollbar{display:none}
.tabs button.tab{flex:none;border:0;background:transparent;padding:8px 0 10px;font-weight:600;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .n{unicode-bidi:isolate;font-size:12px;font-weight:800;margin-inline-start:4px;color:var(--wk);background:var(--wk-bg);border-radius:999px;padding:0 6px}
.tabs .pages-btn{flex:none;border:0;background:transparent;color:var(--muted);padding:0 2px 0 0;margin-inline-start:10px;display:grid;place-items:center;width:34px}

main{min-height:50vh}
main.slide-next{animation:slideN .22s ease}
main.slide-prev{animation:slideP .22s ease}
@keyframes slideN{from{opacity:.2;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes slideP{from{opacity:.2;transform:translateX(24px)}to{opacity:1;transform:none}}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.toolbar .btn{display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:14px}
.head-tools{display:flex;gap:6px;flex:none}
.head-tools .btn.ibtn{padding:0}
.page-head>div:first-child{min-width:0}
.btn.ibtn{position:relative;width:46px;height:46px;padding:0;display:grid;place-items:center;border-radius:13px}
/* same size, same line weight, centred: the three title-row icons read as one set */
.btn.ibtn svg{width:23px;height:23px;display:block;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ibtn.on{border-color:var(--ink)}
.btn.ibtn .dotn{position:absolute;top:-6px;left:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.btn .badge{background:var(--ink);color:var(--bg);border-radius:999px;font-size:12px;padding:0 7px;font-weight:800}
.active-f{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.active-f button{border:0;background:var(--sunk);border-radius:999px;padding:5px 10px 5px 8px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.active-f button::after{content:"×";font-weight:800;color:var(--muted)}

.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px}
.page-head b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block}
.page-head span{display:block;color:var(--muted);font-size:13.5px}
.page-head .btn{flex:none;padding:9px 14px}

.group{margin-top:22px}
.group h2{font-size:14px;font-weight:700;color:var(--muted);margin:0 0 4px;display:flex;align-items:center;gap:8px}
.group h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.group h2 .cnt{color:var(--muted);font-weight:500}
.list{border-top:1px solid var(--line)}
.group.cat{margin-top:14px;background:var(--cbg);border-radius:18px;padding:12px 14px 4px}
.group.cat h2{color:var(--cc);font-size:15.5px;font-weight:800;margin:0 0 2px}
.group.cat h2 .dot{background:var(--cc)}
.group.cat h2 .cnt{color:var(--cc);opacity:.7;font-weight:600}
.group.cat .list{border-top:0}
.group.cat .row{border-bottom-color:var(--cline)}
.group.cat .row:last-child{border-bottom:0}
.group.cat .check{border-color:var(--cc);opacity:.85}
.wk{unicode-bidi:isolate;display:inline-block;vertical-align:2px;margin-inline-start:6px;font-size:11.5px;font-weight:800;color:var(--wk);background:var(--wk-bg);border-radius:999px;padding:1px 8px}
.group.cat h2 .wk{vertical-align:0;font-size:12px}

.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.check{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);opacity:.7;background:transparent;display:grid;place-items:center;color:transparent;transition:background .15s}
.check:hover{color:var(--cc,var(--accent))}
.body{min-width:0;border:0;background:none;text-align:right;padding:0}
.name{display:block;font-weight:600;font-size:16.5px;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}
.meta .sep{opacity:.5}
.meta .cd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cc);margin-inline-end:4px;vertical-align:1px}
.pill{font-size:13.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
.row.s-late .pill{color:var(--late)}
.row.s-today .pill{color:var(--soon)}

.empty{padding:40px 20px;text-align:center;color:var(--muted);margin-top:10px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.alldone{margin-top:14px;background:var(--ok-soft);color:var(--ok);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.alldone b{font-size:16px}
.alldone span{font-size:13.5px;color:var(--ink);opacity:.75}
.note{margin-top:14px;font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:8px 12px}
.foot-c{display:flex;justify-content:center;margin-top:22px}

.hist{border-top:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.hrow span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
button.hrow{width:100%;background:none;border-width:0 0 1px;border-style:solid;border-color:var(--line);text-align:right}
.dayhead{font-size:13px;color:var(--muted);font-weight:700;margin:16px 0 6px}

.pickrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;width:100%;padding:11px 0;border:0;border-bottom:1px solid var(--cline,var(--line));background:none;text-align:right}
.group.cat .pickrow:last-child{border-bottom:0}
.pickbox{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--cc,var(--muted));display:grid;place-items:center;color:transparent}
.pickrow[aria-pressed="true"] .pickbox{background:var(--cc,var(--accent));color:var(--cbg,#fff)}
.pickrow[aria-pressed="true"] .name{color:var(--cc,var(--ink))}

.fab{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom,0px));left:calc(20px + env(safe-area-inset-left,0px));border:0;background:var(--ink);color:var(--bg);border-radius:50%;width:56px;height:56px;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:5}

.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-radius:24px 24px 0 0;max-height:92%;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:10px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
.sheet-in{max-width:600px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet-in{position:relative}
.sheet-x{position:absolute;top:6px;left:0;width:38px;height:38px;border-radius:50%;border:0;background:var(--sunk);color:var(--muted);display:grid;place-items:center}
.sheet h3{padding-left:46px}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px;overflow-wrap:anywhere}
.sheet .sub{color:var(--muted);font-size:13.5px;margin-bottom:12px;min-height:1.4em}
.sheet .sub.saved{color:var(--ok)}
.quick{margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick .btn{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:58px;padding:8px 10px;line-height:1.2}
.quick .btn small{font-size:12.5px;font-weight:600;opacity:.8}
.quick .btn:disabled{cursor:default}
#sh-week{grid-column:1/-1}
#sh-fri[hidden]~#sh-week{grid-column:auto}
#sh-fri.btn{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.btn{border:1px solid var(--line);background:transparent;border-radius:12px;padding:11px 10px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wk-on{background:var(--wk-bg);border-color:var(--wk);color:var(--wk)}
.btn.ghost{border-color:transparent;color:var(--muted);font-weight:600;font-size:14px}
.btn.ghost.arm{color:var(--late)}
.btn.danger{color:var(--late);border-color:var(--late-soft)}
.btn.danger.arm{background:var(--late);color:#fff;border-color:var(--late)}
.btn.small{padding:9px 14px;font-size:14px}
.field{margin-bottom:14px}
.field label,.field .lab{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field .opt{font-weight:500;color:var(--muted);font-size:13px}
.field.err>.lab,.field.err>label{color:var(--late)}
.field.err>.lab::after,.field.err>label::after{content:" · חובה";font-weight:600}
.field input,.field select,.field textarea{width:100%;border:0;background:var(--sunk);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit}
.field textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums}
.opts button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opts button .c{font-weight:500;opacity:.65;margin-inline-start:5px}
.opts button:disabled{opacity:.4;cursor:default}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const ROOMS=["מטבח","סלון","חדר שינה","אמבטיה ושירותים","כביסה","אוראו","כללי"];
const INTS=[3,7,14,21,28,56,90];
const NPAL=14;
const IC={
  check:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg>',
  up:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
  dn:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  pen:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  bin:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  filter:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 5.5h18M6.5 12h11M10 18.5h4"/></svg>',
  tags:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7.5l8.5 8.5-7.5 7.5L4 11.5z"/><circle cx="8.5" cy="8.5" r="1.4"/></svg>',
  cats:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>'
};

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const fmt=s=>{const d=parse(s);return d?d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear():"—"};
const fmtShort=s=>{const d=parse(s);return d.getDate()+"."+(d.getMonth()+1)};
let TODAY=iso(new Date());
function lastFriday(){const d=parse(TODAY);d.setDate(d.getDate()-((d.getDay()-5+7)%7));return iso(d)}
const weekStart=lastFriday;/* the week runs Friday→Thursday */
function gematria(n){
  const ones=["","א","ב","ג","ד","ה","ו","ז","ח","ט"],tens=["","י","כ","ל","מ","נ","ס","ע","פ","צ"],hund=["","ק","ר","ש","ת","תק","תר","תש","תת","תתק"];
  let s=hund[Math.floor(n/100)]||"";const r=n%100;
  if(r===15)s+="טו";else if(r===16)s+="טז";else s+=tens[Math.floor(r/10)]+ones[r%10];
  return s.length===1?s+"׳":s.slice(0,-1)+"״"+s.slice(-1);
}
function hebDate(){
  try{
    const parts=new Intl.DateTimeFormat("he-u-ca-hebrew",{day:"numeric",month:"long",year:"numeric"}).formatToParts(new Date());
    const g=t=>parts.find(p=>p.type===t)?.value||"";
    const day=parseInt(g("day")),year=parseInt(g("year")),month=g("month").replace(/^ב/,"");
    if(!day||!year||!month)return"";
    return `${gematria(day)} ב${month} ${gematria(year%1000)}`;
  }catch(e){return""}
}
function weekday(){return new Intl.DateTimeFormat("he",{weekday:"long"}).format(new Date())}

/* ---------- task timing ---------- */
function nextOf(t){return t.manualNext||(t.last&&t.interval?add(t.last,t.interval):null)}
function remOf(t){const n=nextOf(t);return n==null?null:diff(n,TODAY)}
function statusOf(r){if(r==null)return"none";if(r<0)return"late";if(r===0)return"today";if(r<=7)return"soon";return"later"}
function remLabel(r){
  if(r==null)return"לא מתוזמן";if(r===0)return"היום";if(r===-1)return"באיחור יום";
  if(r<0)return"באיחור "+(-r)+" ימים";if(r===1)return"מחר";return"בעוד "+r+" ימים";
}
function intLabel(n){return n?({7:"כל שבוע",14:"כל שבועיים",21:"כל 3 שבועות",28:"כל 4 שבועות",56:"כל חודשיים",90:"כל 3 חודשים"})[n]||("כל "+n+" ימים"):"בלי תדירות"}
const intShort=n=>({3:"3 ימים",7:"שבוע",14:"שבועיים",21:"3 שבועות",28:"חודש",56:"חודשיים",90:"3 חודשים"})[n]||(n+" ימים");
/* default order: smallest frequency first, then the most overdue first */
function defaultSort(a,b){return (a.interval||1e6)-(b.interval||1e6)||(a.rem??1e9)-(b.rem??1e9)||a.name.localeCompare(b.name,"he")}

/* ---------- store ----------
   One shared collection holds tasks, shopping items (kind:"shop") and a "_settings" document. */
let tasks=new Map(),shop=new Map(),db=null,col=null,mode="loading";
const SETTINGS_ID="_settings";
let settings={};
function absorb(m){
  const st=m.get(SETTINGS_ID);if(st)settings={...st};m.delete(SETTINGS_ID);
  const t=new Map(),s=new Map();
  for(const[id,d]of m){if(!d)continue;(d.kind==="shop"?s:t).set(id,d)}
  tasks=t;shop=s;
}
const allDocs=()=>({...Object.fromEntries(tasks),...Object.fromEntries(shop),[SETTINGS_ID]:{name:SETTINGS_ID,...settings}});
const LS="house-tasks-v1",PEND="house-pending-v1",CACHE="house-cache-v1";
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(allDocs()))}catch(e){}}
let pending={};try{pending=JSON.parse(localStorage.getItem(PEND)||"{}")}catch(e){}
function savePending(){try{localStorage.setItem(PEND,JSON.stringify(pending))}catch(e){}}
async function api(method,id,body){
  const r=await fetch("/api/tasks"+(id?"/"+encodeURIComponent(id):""),{method,cache:"no-store",headers:body?{"content-type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error("HTTP "+r.status);return r.json();
}
function setSync(ok){const b=$("#banner");if(ok)b.hidden=true;else{b.hidden=false;b.textContent="אין חיבור לשרת כרגע. השינויים נשמרו במכשיר ויישלחו כשהחיבור יחזור."}}
let flushing=false,flushAgain=false;
async function flush(){
  if(flushing){flushAgain=true;return}flushing=true;
  try{do{flushAgain=false;for(const id of Object.keys(pending)){const d=pending[id];
    if(d===null)await api("DELETE",id);else await api("PUT",id,d);
    if(pending[id]===d){delete pending[id];savePending()}}}while(flushAgain);setSync(true)}
  catch(e){setSync(false)}finally{flushing=false}
}
let pulling=false;
async function pull(){
  if(pulling||mode!=="remote")return;pulling=true;
  try{await flush();const{tasks:t}=await api("GET");
    const m=new Map(Object.entries(t||{}));for(const[id,d]of Object.entries(pending)){if(d===null)m.delete(id);else m.set(id,d)}
    absorb(m);try{localStorage.setItem(CACHE,JSON.stringify(allDocs()))}catch(e){}
    if(!Object.keys(pending).length)setSync(true);render(true);
  }catch(e){setSync(false)}finally{pulling=false}
}
async function persist(id,data){
  if(mode==="db"){try{if(data===null)await col.doc(id).delete();else await col.doc(id).set(data)}catch(e){showToast("השמירה נכשלה, נסו שוב",false)}}
  else if(mode==="remote"){pending[id]=data;savePending();try{localStorage.setItem(CACHE,JSON.stringify(allDocs()))}catch(e){}flush()}
  else lsSave();
}
function writeDoc(id,data){(data.kind==="shop"?shop:tasks).set(id,data);render(true);persist(id,data)}
function removeDoc(id){tasks.delete(id);shop.delete(id);render(true);persist(id,null)}
function writeSettings(next){
  /* freeze each category's colour before anything moves, so colours never jump */
  next={...next,colors:{...colorMap("tasks"),...colorMap("shop"),...(next.colors||{})}};
  settings=next;render(true);persist(SETTINGS_ID,{name:SETTINGS_ID,...next});
}
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- categories (tasks and shopping each have their own list) ---------- */
const BUILTIN={high:"משימות לשבוע הזה",mid:"חשיבות בינונית",low:"משימות פחות חשובות"};
const SHOP_DEFAULT=["ירקות ופירות","מוצרי חלב וביצים","לחם ומאפים","בשר ודגים","מזווה","ניקיון","טואלטיקה ופארם","אוראו"].map(n=>"s:"+n);
const catKeyOf=(dom,x)=>dom==="shop"?x.cat:(x.priority||"none");
function catList(dom){
  const set=settings.cats?.[dom];if(set)return set;
  if(dom==="shop")return SHOP_DEFAULT;
  /* first run: rebuild the list the earlier version showed */
  const used=new Set([...tasks.values()].map(t=>t.priority||"none")),hidden=settings.hidden||[];
  const custom=[...used].filter(k=>k.startsWith("c:"));
  const def=["high","mid",...custom,"low"].filter(k=>!hidden.includes(k)||used.has(k));
  const ord=(settings.catOrder||[]).filter(k=>def.includes(k));
  for(const k of def)if(!ord.includes(k))ord.push(k);
  return ord;
}
function catLabel(k){return settings.labels?.[k]||BUILTIN[k]||(k&&/^[cs]:/.test(k)?k.slice(2).replace(/·+$/,""):"ללא קטגוריה")}
function colorMap(dom){
  const list=catList(dom),saved=settings.colors||{},out={},used=new Set();
  const fixed={high:1,mid:2,low:3};
  for(const k of list){const c=saved[k]??(dom==="tasks"?fixed[k]:undefined);if(c&&!used.has(c)){out[k]=c;used.add(c)}}
  for(const k of list){if(out[k])continue;let n=1;while(used.has(n)&&n<=NPAL)n++;if(n>NPAL)n=(list.indexOf(k)%NPAL)+1;out[k]=n;used.add(n)}
  return out;
}
function catNum(dom,k){return colorMap(dom)[k]||0}
function catStyle(dom,k){const n=catNum(dom,k);return `--cc:var(--c${n});--cbg:var(--c${n}-bg);--cline:var(--c${n}-line)`}
/* shopping categories sit inside three broad sections, like the old app */
const SECTIONS0=[{id:"urgent",name:"דחוף"},{id:"home",name:"בית"},{id:"shani",name:"שני"}];
/* main shopping categories: editable, each can also be shown as its own page */
const sections=()=>settings.shopSections||SECTIONS0;
const SHANI_DEFAULT=["אייהרב","שיין לשני","טיפוח ובריאות","סופר פארם","בגדים"];
const secName=id=>sections().find(x=>x.id===id)?.name||"";
function sectionOf(k){
  const all=sections(),has=id=>all.some(x=>x.id===id);
  const set=settings.catSection?.[k];if(set&&has(set))return set;
  const d=catLabel(k)==="דחוף"?"urgent":SHANI_DEFAULT.includes(catLabel(k))?"shani":"home";
  return has(d)?d:(has("home")?"home":all[0]?.id);
}
const alwaysList=()=>settings.alwaysWeek??["c:קבועות"];
const isAlways=k=>alwaysList().includes(k);
const doneThisWeek=t=>!!t.last&&t.last>=weekStart();
function weekTodo(){return[...tasks.values()].filter(t=>isAlways(catKeyOf("tasks",t))?!doneThisWeek(t):t.thisWeek)}
/* guess a category from the name: words shared with existing items, plus a small grocery dictionary */
const SHOP_WORDS={"ירקות ופירות":"עגבניות מלפפונים בצל תפוחים בננות גזר פלפל חסה תפוזים לימון אבוקדו תותים ענבים שום תפוחי אדמה בטטה קישואים חציל פטרוזיליה כוסברה שמיר נענע אגסים אפרסקים מלון אבטיח ירקות פירות","מוצרי חלב וביצים":"חלב גבינה יוגורט ביצים חמאה שמנת קוטג לבן מעדן לבנה בולגרית צפתית","לחם ומאפים":"לחם פיתות לחמניות חלה בגט עוגה עוגיות קרקרים טורטיות","בשר ודגים":"עוף בשר שניצל דגים סלמון הודו קבב כרעיים חזה טחון נקניק","מזווה":"אורז פסטה קמח סוכר שמן מלח קפה תה קטשופ טחינה שימורים טונה פתיתים קורנפלקס דבש ריבה עדשים שעועית תבלינים פפריקה חומוס ממרח שוקולד במבה ביסלי חטיפים","ניקיון":"אקונומיקה סבון כלים אבקת כביסה מרכך כביסה ספוגים נייר טואלט מגבות נייר שקיות זבל מטליות ג'ל מסיר שומנים אנטי קאלק","טואלטיקה ופארם":"שמפו מרכך שיער סבון גוף משחת שיניים מברשת שיניים דאודורנט קרם תחבושות מגבונים צמר גפן תרופות אקמול ויטמינים","אוראו":"אוראו כלב מזון לכלב חטיף לכלב רצועה"};
function words(s){return String(s||"").replace(/[^֐-׿a-zA-Z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>=2)}
const near=(a,b)=>a===b||(a.length>=3&&b.length>=3&&a.slice(0,3)===b.slice(0,3));
function guessCat(dom,name){
  const w=words(name);if(!w.length)return null;
  const list=catList(dom),score=new Map();
  for(const x of(dom==="shop"?shop:tasks).values()){
    const k=catKeyOf(dom,x);if(!list.includes(k))continue;
    const xs=words(x.name);let s=0;for(const a of w)s+=xs.includes(a)?2:xs.some(b=>near(a,b))?1:0;
    if(s)score.set(k,(score.get(k)||0)+s);
  }
  if(dom==="shop")for(const k of list){const dict=SHOP_WORDS[catLabel(k)];if(!dict)continue;const ds=words(dict);let s=0;for(const a of w)if(ds.some(b=>near(a,b)))s+=2;if(s)score.set(k,(score.get(k)||0)+s)}
  let best=null,bs=0;for(const[k,s]of score)if(s>bs){best=k;bs=s}
  return best;
}

const STATUS={late:"באיחור",today:"היום",soon:"בשבוע הקרוב",later:"בהמשך",none:"לא מתוזמן"};
const qmatch=x=>!query.trim()||x.name.includes(query.trim());

}

function panel(dom,k,title,inner,count,extra=""){
  return `<section class="group cat" style="${catStyle(dom,k)}">${title==null?"":`<h2><span class="dot"></span>${title}${extra}<span class="cnt">${count}</span></h2>`}<div class="list">${inner}</div></section>`;

function addRow(k){return `<form class="addrow" data-addcat="${esc(k)}"><span class="plus" aria-hidden="true">+</span><input type="text" data-addin="${esc(k)}" data-keep="add-${esc(k)}" placeholder="הוספה ל${esc(catLabel(k))}" enterkeyhint="done" autocomplete="off" aria-label="הוספת מוצר ל${esc(catLabel(k))}"><button type="submit" class="addok" aria-label="שמירה">${IC.check}</button></form>`}
let collapsed=new Set();try{collapsed=new Set(JSON.parse(localStorage.getItem("house-collapsed")||"[]"))}catch(e){}
/* shopping: section (דחוף / בית / שני) → category panels → items, each list ending in an add row */
function shopSections(items,{showEmpty,adds,secFilter,noHead}){
  const list=catList("shop");let h="";
  for(const sec of sections()){
    if(secFilter&&secFilter!==sec.id)continue;
    const cats=list.filter(k=>sectionOf(k)===sec.id);
    let body="",n=0;
    for(const k of cats){const g=items.filter(it=>it.cat===k);if(!g.length&&!showEmpty)continue;n+=g.length;
      const inner=g.map(it=>shopRow(it,["store","note"])).join("")+(adds?addRow(k):"");
      const solo=cats.length===1&&catLabel(k)===sec.name,ck="c:"+k,closed=collapsed.has(ck);
      body+=solo?`<section class="group cat" data-cat="${esc(k)}" style="${catStyle("shop",k)}"><div class="list">${inner}</div></section>`:`<section class="group cat${closed?" closed":""}" data-cat="${esc(k)}" style="${catStyle("shop",k)}"><button type="button" class="cat-h" data-collapse="${esc(ck)}" aria-expanded="${!closed}"><span class="dot"></span><span class="t">${esc(catLabel(k))}</span><span class="cnt">${g.length}</span></button><div class="list">${inner}</div></section>`}
    if(!body)continue;
    if(noHead){h+=body;continue}
    h+=`<section class="sect${collapsed.has(sec.id)?" closed":""}"><button type="button" class="sect-h" data-collapse="${sec.id}" aria-expanded="${!collapsed.has(sec.id)}"><b>${esc(sec.name)}</b><span class="cnt">${n}</span></button><div class="sect-b">${body}</div></section>`;
  }
  const orphans=items.filter(it=>!list.includes(it.cat));
  if(orphans.length)h+=plain("ללא קטגוריה",orphans.map(it=>shopRow(it,["store","note"])).join(""),orphans.length);
  return h;
}
function plain(title,inner,count){return `<section class="group"><h2><span class="dot"></span>${title}<span class="cnt">${count}</span></h2><div class="list">${inner}</div></section>`}
function catPanels(dom,items,rowFn){
  const list=catList(dom),out=[];
  for(const k of list){const g=items.filter(x=>catKeyOf(dom,x)===k);if(g.length)out.push(panel(dom,k,esc(catLabel(k)),g.map(rowFn).join(""),g.length,""))}
  const orphans=items.filter(x=>!list.includes(catKeyOf(dom,x)));
  if(orphans.length)out.push(plain("ללא קטגוריה",orphans.map(rowFn).join(""),orphans.length));
  return out.join("");
}

function render(soft){
  TODAY=iso(new Date());
  const hd=hebDate();
  $("#today").innerHTML=`<b>${weekday()}, ${fmt(TODAY)}</b>${hd?" · "+hd:""}`;
  /* open on the first page in the saved order, once the data (and that order) has arrived */

  if(!pageList().includes(page))page=pageList()[0];
  renderTabs();

  if(focusKey&&!refocus){const el=main.querySelector(`[data-keep="${CSS.escape(focusKey)}"]`);if(el){el.focus({preventScroll:true});try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}

function renderPage(){
  if(page==="week")return renderWeek();

}
function renderTaskList(f){
  const v=viewOf(page);

  items.sort(f.sort==="late"?(a,b)=>(a.rem??1e9)-(b.rem??1e9)||defaultSort(a,b):f.sort==="name"?(a,b)=>a.name.localeCompare(b.name,"he"):defaultSort);
  const h=`<div class="page-head"><div><b>${esc(v?v.name:"כל המשימות")}</b><span>${items.length===tasks.size?`${tasks.size} משימות`:`${items.length} מתוך ${tasks.size} משימות`}</span></div>${toolIcons("tasks",f)}</div>`+activeChips("tasks",f);
  if(!tasks.size)return h+`<div class="empty"><b>עוד אין משימות</b>לחצי על + כדי להוסיף את הראשונה.</div>`;

  if(f.group==="room")return h+[...ROOMS,""].map(r=>{const g=items.filter(t=>(t.room||"")===r);return g.length?plain(esc(r||"בלי חדר"),g.map(t=>taskRow(t,["cat","int"])).join(""),g.length):""}).join("");
  if(f.group==="int"){const ints=[...new Set(items.map(t=>t.interval||0))].sort((a,b)=>(a||1e6)-(b||1e6));return h+ints.map(n=>{const g=items.filter(t=>(t.interval||0)===n);return plain(intLabel(n),g.map(t=>taskRow(t,["cat","room"])).join(""),g.length)}).join("")}
  return h+`<section class="group"><div class="list">${items.map(t=>taskRow(t,["cat","room","int"])).join("")}</div></section>`;
}
function renderWeek(){
  const all=allTasks().filter(qmatch);
  if(picking){
    const list=catList("tasks").filter(k=>!isAlways(k));
    const n=all.filter(t=>t.thisWeek&&!isAlways(catKeyOf("tasks",t))).length;
    const fixedNames=catList("tasks").filter(isAlways).map(k=>`"${esc(catLabel(k))}"`).join(", ");
    let h=`<div class="page-head"><div><b>בחירת משימות לשבוע</b><span>${n?`נבחרו ${n}`:"סמני את המשימות שתרצי לעשות השבוע"}</span></div><button class="btn primary" id="wk-end">סיום</button></div>`;
    if(fixedNames)h+=`<p class="note">המשימות מ־${fixedNames} מופיעות בכל שבוע אוטומטית, לכן הן לא ברשימה כאן.</p>`;
    for(const k of list){const g=all.filter(t=>catKeyOf("tasks",t)===k).sort(defaultSort);if(!g.length)continue;
      h+=panel("tasks",k,esc(catLabel(k)),g.map(t=>`<button class="pickrow" data-pick="${t.id}" aria-pressed="${!!t.thisWeek}"><span class="pickbox">${IC.check}</span><span class="body"><span class="name">${esc(t.name)}</span><span class="meta"><span>${intLabel(t.interval)}</span><span class="sep">·</span><span>${remLabel(t.rem)}</span></span></span></button>`).join(""),g.filter(t=>t.thisWeek).length||"")}
    return h;
  }
  /* fixed categories are always on the list; picked tasks stay until they are done */
  const fixed=all.filter(t=>isAlways(catKeyOf("tasks",t))),fixedTodo=fixed.filter(t=>!doneThisWeek(t));
  const picked=all.filter(t=>t.thisWeek&&!isAlways(catKeyOf("tasks",t)));
  const list=[...fixed,...picked].sort(defaultSort),left=fixedTodo.length+picked.length,allDone=!left&&fixed.length>0;
  let h=`<div class="page-head"><div><b>משימות השבוע</b><span>${left?`נשארו ${left} משימות`:allDone?"כל המשימות הושלמו":"אין משימות לשבוע הזה"}</span></div></div>`;
  if(!list.length)return h+`<div class="empty"><b>אין משימות לשבוע הזה</b>בחלון של כל משימה אפשר ללחוץ "הוספה לשבוע".</div>`;
  if(allDone)h+=`<div class="alldone"><b>כל המשימות של השבוע הושלמו 🎉</b><span>ההודעה תיעלם ביום שישי, כשיגיע הזמן לעשות אותן שוב.</span></div>`;
  h+=catPanels("tasks",list,t=>taskRow(t,["int"]));
  if(picked.length)h+=`<div class="foot-c"><button class="btn ghost" id="wk-clear">ניקוי המשימות שבחרתי</button></div>`;
  return h;
}
function renderHistory(){

  if(mDom==="pages"){
    $("#ord-title").textContent=area==="shop"?"סדר הדפים בקניות":"סדר הדפים במשימות";$("#ord-hint").textContent="החצים משנים את סדר הדפים. במשימות, הדף הראשון נפתח כשנכנסים לאפליקציה. לדפים ששמרת מהסינון אפשר לשנות שם ולמחוק אותם.";$("#ord-add").hidden=true;

      return `<li><span class="nm">${esc(pageName(id))}${v?`<span class="always">דף סינון</span>`:""}</span>${v?`<button type="button" class="ib" data-vren="${id}" aria-label="שינוי שם">${IC.pen}</button><button type="button" class="ib" data-vdel="${id}" aria-label="מחיקה">${IC.bin}</button>`:""}<button type="button" class="ib" data-pmv="${id}" data-d="-1" aria-label="הזזה למעלה"${i===0?" disabled":""}>${IC.up}</button><button type="button" class="ib" data-pmv="${id}" data-d="1" aria-label="הזזה למטה"${i===pl.length-1?" disabled":""}>${IC.dn}</button></li>`}).join("");

    $("#ord-add").hidden=false;
    const items=dom==="shop"?[...shop.values()].filter(s=>!s.bought):[...tasks.values()];
    $("#ord-add-sec").hidden=dom!=="shop";$("#ord-add-sec").innerHTML=sections().map(x=>`<option value="${x.id}"${x.id==="home"?" selected":""}>${esc(x.name)}</option>`).join("");
    const rowFor=(k,first,last)=>{const st=catStyle(dom,k),n=items.filter(x=>catKeyOf(dom,x)===k).length;
      if(k===mEdit)return `<li style="${st}" class="editing"><input type="text" id="ord-in" maxlength="30" value="${esc(catLabel(k))}" aria-label="שם הקטגוריה"><button type="button" class="txtb" data-save="${esc(k)}">שמירה</button><button type="button" class="txtb plain" data-cancel="1">ביטול</button>${dom==="tasks"?`<label class="chk"><input type="checkbox" id="ord-always"${isAlways(k)?" checked":""}>להציג תמיד במשימות השבוע</label>`:`<label class="chk">שייכת ל: <select id="ord-sec" aria-label="שייכת ל">${sections().map(x=>`<option value="${x.id}"${sectionOf(k)===x.id?" selected":""}>${esc(x.name)}</option>`).join("")}</select></label>`}</li>`;

    if(dom==="shop")$("#ord-list").innerHTML=sections().map(sec=>{const ks=list.filter(k=>sectionOf(k)===sec.id);return `<li class="sechead">${esc(sec.name)}</li>`+(ks.length?ks.map((k,i)=>rowFor(k,i===0,i===ks.length-1)).join(""):`<li class="secempty">אין קטגוריות</li>`)}).join("");
    else $("#ord-list").innerHTML=list.map((k,i)=>rowFor(k,i===0,i===list.length-1)).join("");
  }
  const inp=$("#ord-in");if(inp){inp.focus();inp.select()}

function openManage(dom){mDom=dom;mEdit=mDel=null;renderManage();$("#ord-scrim").classList.add("on");$("#ordp").classList.add("on")}
function closeManage(){mEdit=mDel=null;$("#ord-scrim").classList.remove("on");$("#ordp").classList.remove("on")}
$("#pages-btn").onclick=()=>openManage("pages");
$("#ord-switch").onclick=()=>{mDom=mDom==="sections"?"shop":"sections";mEdit=mDel=null;renderManage()};
const writeSections=(list,extra={})=>writeSettings({...settings,...extra,shopSections:list});
$("#ord-done").onclick=closeManage;$("#ord-scrim").onclick=closeManage;
function saveCatRename(k){
  const dom=mDom,name=($("#ord-in")?.value||"").trim().replace(/\s+/g," ");
  if(!name){msg("צריך שם לקטגוריה");return}
  if(catList(dom).some(c=>c!==k&&catLabel(c)===name)){msg("כבר יש קטגוריה בשם הזה");return}
  const extra={labels:{...(settings.labels||{}),[k]:name}};
  if(dom==="tasks"){const al=new Set(alwaysList());if($("#ord-always")?.checked)al.add(k);else al.delete(k);extra.alwaysWeek=[...al]}
  else if($("#ord-sec"))extra.catSection={...(settings.catSection||{}),[k]:$("#ord-sec").value};
  mEdit=null;setCats(dom,catList(dom),extra);renderManage();
}
function deleteCat(k){
  const dom=mDom,to=$("#ord-move")?.value,prevS=structuredClone(settings),label=catLabel(k);
  const src=dom==="shop"?shop:tasks,moved=[...src.entries()].filter(([,x])=>catKeyOf(dom,x)===k);
  if(moved.length&&!to)return;
  moved.forEach(([id,x])=>writeDoc(id,dom==="shop"?{...x,cat:to}:{...x,priority:to}));
  mDel=null;setCats(dom,catList(dom).filter(x=>x!==k));renderManage();
  showToast(`"${label}" נמחקה${moved.length?` · ${moved.length} עברו ל"${catLabel(to)}"`:""}`,()=>{moved.forEach(([id,x])=>writeDoc(id,x));writeSettings(prevS)});
}
$("#ord-list").addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("[data-cancel]")){mEdit=mDel=null;renderManage();return}
  /* main shopping categories */
  const sr=t.closest("[data-sren]");if(sr){mDel=null;mEdit="sec:"+sr.dataset.sren;renderManage();return}
  const ss=t.closest("[data-ssave]");if(ss){const id=ss.dataset.ssave,name=($("#ord-in")?.value||"").trim().replace(/\s+/g," ");
    if(!name){msg("צריך שם לקטגוריה הראשית");return}
    if(sections().some(x=>x.id!==id&&x.name===name)){msg("כבר יש קטגוריה ראשית בשם הזה");return}
    const page=!!$("#ord-secpage")?.checked;mEdit=null;writeSections(sections().map(x=>x.id===id?{...x,name,page}:x));renderManage();return}
  const sd=t.closest("[data-sdel]");if(sd){mEdit=null;mDel="sec:"+sd.dataset.sdel;renderManage();return}
  const sk=t.closest("[data-sdelok]");if(sk){const id=sk.dataset.sdelok,to=$("#ord-smove")?.value,prevS=structuredClone(settings),name=secName(id);
    const cats=catList("shop").filter(k=>sectionOf(k)===id),cs={...(settings.catSection||{})};
    if(cats.length&&!to)return;for(const k of cats)cs[k]=to;
    mDel=null;writeSections(sections().filter(x=>x.id!==id),{catSection:cs});renderManage();
    showToast(`"${name}" נמחקה${cats.length?` · ${cats.length} קטגוריות עברו ל"${secName(to)}"`:""}`,()=>writeSettings(prevS));return}
  const sm=t.closest("[data-smv]");if(sm){if(sm.disabled)return;const l=[...sections()],i=l.findIndex(x=>x.id===sm.dataset.smv),j=i+(+sm.dataset.d);if(j<0||j>=l.length)return;
    /* keep each category where it is: pin current sections before reordering */
    const cs={...(settings.catSection||{})};for(const k of catList("shop"))cs[k]=sectionOf(k);
    [l[i],l[j]]=[l[j],l[i]];writeSections(l,{catSection:cs});renderManage();return}
  /* pages */
  const pm=t.closest("[data-pmv]");if(pm){if(pm.disabled)return;const l=pageList(),i=l.indexOf(pm.dataset.pmv),j=i+(+pm.dataset.d);[l[i],l[j]]=[l[j],l[i]];setPageOrder(l);renderManage();return}
  const vr=t.closest("[data-vren]");if(vr){mDel=null;mEdit=vr.dataset.vren;renderManage();return}
  const vs=t.closest("[data-vsave]");if(vs){const name=($("#ord-in")?.value||"").trim();if(!name){msg("צריך שם לדף");return}writeSettings({...settings,views:views().map(v=>v.id===vs.dataset.vsave?{...v,name}:v)});mEdit=null;renderManage();return}
  const vd=t.closest("[data-vdel]");if(vd){mEdit=null;mDel=vd.dataset.vdel;renderManage();return}
  const vk=t.closest("[data-vdelok]");if(vk){const id=vk.dataset.vdelok,prevS=structuredClone(settings),v=viewOf(id);writeSettings({...settings,views:views().filter(x=>x.id!==id),pages:[...pageList("tasks"),...pageList("shop")].filter(x=>x!==id)});mDel=null;renderManage();showToast(`הדף "${v.name}" נמחק`,()=>writeSettings(prevS));return}
  /* categories */
  const sw=t.closest("[data-color]");if(sw){const k=sw.dataset.color,map=colorMap(mDom),used=new Set(catList(mDom).filter(x=>x!==k).map(x=>map[x]));let n=map[k];for(let i=0;i<NPAL;i++){n=n%NPAL+1;if(!used.has(n))break}writeSettings({...settings,colors:{...colorMap("tasks"),...colorMap("shop"),[k]:n}});renderManage();return}
  const sv=t.closest("[data-save]");if(sv){saveCatRename(sv.dataset.save);return}
  const rn=t.closest("[data-ren]");if(rn){mDel=null;mEdit=rn.dataset.ren;renderManage();return}
  const dl=t.closest("[data-del]");if(dl){mEdit=null;mDel=dl.dataset.del;renderManage();return}
  const ok=t.closest("[data-delok]");if(ok){deleteCat(ok.dataset.delok);return}
  const b=t.closest("[data-mv]");if(!b||b.disabled)return;
  const l=catList(mDom),i=l.indexOf(b.dataset.mv),d=+b.dataset.d;if(i<0)return;
  /* in shopping, swap with the nearest category of the same section */
  let j=i+d;if(mDom==="shop"){const sec=sectionOf(l[i]);while(j>=0&&j<l.length&&sectionOf(l[j])!==sec)j+=d}
  if(j<0||j>=l.length)return;
  const nl=[...l];[nl[i],nl[j]]=[nl[j],nl[i]];setCats(mDom,nl);renderManage();
});
$("#ord-list").addEventListener("keydown",e=>{if(e.target.id!=="ord-in")return;if(e.key==="Enter"){e.preventDefault();$("#ord-list [data-save],#ord-list [data-vsave]")?.click()}else if(e.key==="Escape"){e.stopPropagation();mEdit=null;renderManage()}});
function addFromPanel(){const name=$("#ord-add-in").value.trim();if(!name)return;
  if(mDom==="sections"){if(sections().some(x=>x.name===name)){msg("כבר יש קטגוריה ראשית בשם הזה");return}
    const cs={...(settings.catSection||{})};for(const k of catList("shop"))cs[k]=sectionOf(k);
    writeSections([...sections(),{id:"x"+Date.now().toString(36),name,page:false}],{catSection:cs});$("#ord-add-in").value="";renderManage();return}if(catList(mDom).some(k=>catLabel(k)===name)){msg("כבר יש קטגוריה בשם הזה");return}const k=addCategory(mDom,name);if(k&&mDom==="shop")writeSettings({...settings,catSection:{...(settings.catSection||{}),[k]:$("#ord-add-sec").value}});$("#ord-add-in").value="";renderManage()}
$("#ord-add-ok").onclick=addFromPanel;

/* ---------- drag a product onto another category ---------- */
{let drag=null;
 const target=(x,y)=>{const el=document.elementFromPoint(x,y);return el?.closest?.("[data-cat]")};
 document.addEventListener("pointerdown",e=>{
   const h=e.target.closest("[data-drag]");if(!h)return;e.preventDefault();
   const row=h.closest(".row"),it=shop.get(h.dataset.drag);if(!row||!it)return;
   const r=row.getBoundingClientRect(),ghost=row.cloneNode(true);ghost.className="row shoprow drag-ghost";
   Object.assign(ghost.style,{width:r.width+"px",left:r.left+"px",top:r.top+"px"});document.body.append(ghost);
   row.classList.add("dragging");document.body.classList.add("is-dragging");
   drag={id:h.dataset.drag,row,ghost,dy:e.clientY-r.top,over:null,pid:e.pointerId,y:e.clientY};
   try{h.setPointerCapture(e.pointerId)}catch(err){}
 });
 const move=e=>{if(!drag||e.pointerId!==drag.pid)return;drag.y=e.clientY;drag.ghost.style.top=(e.clientY-drag.dy)+"px";
   drag.ghost.style.visibility="hidden";const t=target(e.clientX,e.clientY);drag.ghost.style.visibility="";
   if(t!==drag.over){drag.over?.classList.remove("drop-on");drag.over=t;t?.classList.add("drop-on")}};
 document.addEventListener("pointermove",move);
 /* scroll the page while the finger rests near the top or bottom */
 setInterval(()=>{if(!drag)return;const m=70;if(drag.y<m)window.scrollBy(0,-12);else if(drag.y>innerHeight-m)window.scrollBy(0,12)},30);
 const end=e=>{if(!drag||(e&&e.pointerId!==drag.pid))return;const{id,row,ghost,over}=drag;drag=null;
   ghost.remove();row.classList.remove("dragging");document.body.classList.remove("is-dragging");over?.classList.remove("drop-on");
   const it=shop.get(id),to=over?.dataset.cat;if(!it||!to||to===it.cat)return;
   const prev=structuredClone(it),store=storeOf(it)&&storeOf(it)===inferStore(it.cat)?inferStore(to):(it.store||"");
   writeDoc(id,{...it,cat:to,store});showToast(`"${it.name}" הועבר ל${catLabel(to)}`,()=>writeDoc(id,prev))};
 document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end);
}

async function startRemote(){
  if(!/^https?:$/.test(location.protocol))return false;
  let cached=null;try{cached=JSON.parse(localStorage.getItem(CACHE)||"null")}catch(e){}
  if(cached){mode="remote";absorb(new Map(Object.entries(cached)));render()}
  try{
    const r=await fetch("/api/tasks",{cache:"no-store"});
    if(r.status===404){if(cached)mode="loading";return false}
    if(!r.ok)throw new Error();
    mode="remote";absorb(new Map(Object.entries((await r.json()).tasks||{})));
    if(!userNavigated)pageInit=false;/* the first page comes from the server's page order — unless she has already moved */
    try{localStorage.setItem(CACHE,JSON.stringify(allDocs()))}catch(e){}
    await pull();
  }catch(e){if(!cached)return false;mode="remote";setSync(false)}
  render(true);
  setInterval(()=>{if(document.visibilityState==="visible")pull()},15000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()});
  window.addEventListener("online",pull);window.addEventListener("focus",pull);
  return true;
}
(async()=>{
  if(!window.claude&&await startRemote())return;
  try{db=window.claude?.use?await window.claude.use("db"):null}catch(e){db=null}
  if(db){
    col=db.collection("tasks");mode="db";
    col.onSnapshot(snap=>{absorb(new Map(snap.docs.map(d=>[d.id,d.data()])));render(true)},
      ()=>{$("#banner").hidden=false;$("#banner").textContent="אין חיבור לשמירה כרגע. השינויים יישמרו כשהחיבור יחזור."});
  }else{
    mode="local";let saved=lsLoad(),seeded=null;
    try{seeded=localStorage.getItem("house-seeded")}catch(e){}
    if(!Object.keys(saved).length&&!seeded&&window.HOUSE_SEED){saved=structuredClone(window.HOUSE_SEED);try{localStorage.setItem("house-seeded","1")}catch(e){}}
    absorb(new Map(Object.entries(saved)));lsSave();
    $("#banner").hidden=false;$("#banner").textContent="הנתונים נשמרים בדפדפן הזה בלבד, ולא מסתנכרנים בין מכשירים.";
    render();
  }
})();
